<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your email address has been changed</title>
  <style>
    body { margin: 0; padding: 0; background-color: #080808; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #F2F2F0; }

    .logo span { color: #7B1016; }
    .content { padding: 40px; text-align: center; }
    h1 { margin: 0 0 16px; font-size: 24px; font-weight: 700; color: #ffffff; }
    p { margin: 0 0 32px; font-size: 15px; line-height: 1.6; color: #B9B9B9; }
    .footer { padding: 24px 40px; background-color: #0a0a0a; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; font-size: 12px; color: #7E7E7E; }

</head>

  <div class="container">
    <div class="header">
      <a href="{{ .SiteURL }}" class="logo">
        VOU<span>X</span>A
